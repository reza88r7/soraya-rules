<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدیریت کاربران - شرکت ثریا</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Vazirmatn', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: #0b0b0e;
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(120, 80, 200, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(200, 120, 50, 0.10) 0%, transparent 50%);
            padding: 2rem 1rem;
            transition: background 0.4s ease;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 0 0.5rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(145deg, #f5b06b, #d48a4a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #fff;
            box-shadow: 0 8px 32px rgba(200, 140, 60, 0.3);
        }

        .header-title h1 {
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
        }

        .header-title h1 span {
            background: linear-gradient(135deg, #f5b06b, #e8a050);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-title .sub {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
        }

        /* ===== BUTTONS ===== */
        .btn-group {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Vazirmatn', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }

        .btn-home {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-home:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: translateY(-2px);
        }

        /* ===== STATS ===== */
        .stats-bar {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding: 0 0.5rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 0.7rem 1.6rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .stat-card i {
            color: #f5b06b;
            font-size: 1.2rem;
        }

        .stat-card .num {
            font-weight: 700;
            color: #fff;
            font-size: 1.2rem;
        }

        /* ===== TABLE ===== */
        .table-wrapper {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            overflow: hidden;
            overflow-x: auto;
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 700px;
        }

        .table-wrapper thead {
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .table-wrapper th {
            padding: 1rem 1.2rem;
            text-align: right;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .table-wrapper td {
            padding: 0.9rem 1.2rem;
            color: rgba(255, 255, 255, 0.75);
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            vertical-align: middle;
        }

        .table-wrapper tbody tr {
            transition: all 0.2s ease;
        }

        .table-wrapper tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .table-wrapper tbody tr:last-child td {
            border-bottom: none;
        }

        .table-wrapper .badge-skill {
            display: inline-block;
            background: rgba(245, 176, 107, 0.08);
            color: #f5b06b;
            padding: 0.1rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            border: 1px solid rgba(245, 176, 107, 0.04);
            margin: 0.1rem;
        }

        .table-wrapper .btn-delete {
            background: rgba(255, 80, 80, 0.08);
            border: none;
            color: #ff6b6b;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: 'Vazirmatn', sans-serif;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .table-wrapper .btn-delete:hover {
            background: rgba(255, 80, 80, 0.2);
            transform: scale(1.05);
        }

        /* ===== THEME TOGGLE ===== */
        .theme-toggle {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            padding: 0.4rem 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            backdrop-filter: blur(10px);
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .theme-toggle .dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(145deg, #f5b06b, #d48a4a);
            transition: all 0.4s ease;
        }

        /* ===== LIGHT THEME ===== */
        body.light {
            background: #f5f0eb;
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(245, 176, 107, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(180, 120, 255, 0.04) 0%, transparent 50%);
        }

        body.light .header-title h1 {
            color: #1a1a1e;
        }

        body.light .header-title .sub {
            color: rgba(0, 0, 0, 0.4);
        }

        body.light .stat-card {
            background: rgba(255, 255, 255, 0.6);
            border-color: rgba(0, 0, 0, 0.04);
            color: rgba(0, 0, 0, 0.5);
        }

        body.light .stat-card .num {
            color: #1a1a1e;
        }

        body.light .table-wrapper {
            background: rgba(255, 255, 255, 0.5);
            border-color: rgba(0, 0, 0, 0.04);
        }

        body.light .table-wrapper thead {
            background: rgba(0, 0, 0, 0.02);
            border-color: rgba(0, 0, 0, 0.04);
        }

        body.light .table-wrapper th {
            color: rgba(0, 0, 0, 0.3);
        }

        body.light .table-wrapper td {
            color: rgba(0, 0, 0, 0.7);
            border-color: rgba(0, 0, 0, 0.03);
        }

        body.light .table-wrapper tbody tr:hover {
            background: rgba(0, 0, 0, 0.02);
        }

        body.light .table-wrapper .badge-skill {
            background: rgba(212, 138, 74, 0.08);
            color: #d48a4a;
            border-color: rgba(212, 138, 74, 0.04);
        }

        body.light .btn-home {
            background: rgba(0, 0, 0, 0.04);
            color: rgba(0, 0, 0, 0.5);
            border-color: rgba(0, 0, 0, 0.04);
        }

        body.light .btn-home:hover {
            background: rgba(0, 0, 0, 0.08);
            color: #1a1a1e;
        }

        body.light .theme-toggle {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.06);
            color: rgba(0, 0, 0, 0.4);
        }

        body.light .theme-toggle .dot {
            background: linear-gradient(145deg, #8a8a8a, #5a5a5a);
        }

        body.light .btn-delete {
            background: rgba(255, 80, 80, 0.06);
            color: #e05555;
        }

        body.light .btn-delete:hover {
            background: rgba(255, 80, 80, 0.12);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header-title h1 {
                font-size: 1.3rem;
            }
            .logo-icon {
                width: 48px;
                height: 48px;
                font-size: 1.4rem;
            }
            .stat-card {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
            .btn {
                padding: 0.5rem 1.2rem;
                font-size: 0.8rem;
            }
            .table-wrapper td,
            .table-wrapper th {
                padding: 0.6rem 0.8rem;
                font-size: 0.8rem;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(245, 176, 107, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(245, 176, 107, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="header-left">
                <div class="logo-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="header-title">
                    <h1>مدیریت <span>کاربران</span></h1>
                    <div class="sub">
                        <i class="fas fa-building"></i> شرکت ثریا · پنل مدیریت
                    </div>
                </div>
            </div>

            <div style="display:flex; gap:0.8rem; flex-wrap:wrap; align-items:center;">
                <a href="index.html" class="btn btn-home">
                    <i class="fas fa-arrow-right"></i>
                    بازگشت به قوانین
                </a>
                <div class="theme-toggle" id="themeToggle">
                    <i class="fas fa-sun"></i>
                    <div class="dot" id="themeDot"></div>
                    <i class="fas fa-moon"></i>
                </div>
            </div>
        </div>

        <!-- ===== STATS ===== -->
        <div class="stats-bar">
            <div class="stat-card">
                <i class="fas fa-user"></i>
                <span>تعداد کاربران: <span class="num" id="userCount">۰</span></span>
            </div>
        </div>

        <!-- ===== TABLE ===== -->
        <div class="table-wrapper">
            <table id="userTable">
                <thead>
                    <tr>
                        <th>ردیف</th>
                        <th>نام و نام خانوادگی</th>
                        <th>نام پدر</th>
                        <th>تاریخ تولد</th>
                        <th>شماره همراه</th>
                        <th>ایمیل</th>
                        <th>رشته</th>
                        <th>مدرک تحصیلی</th>
                        <th>نحوه همکاری</th>
                        <th>توانایی‌ها</th>
                        <th>عملیات</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </div>

    <!-- ===== SCRIPT ===== -->
    <script>
        // ===== THEME =====
        const toggle = document.getElementById('themeToggle');
        const dot = document.getElementById('themeDot');

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light');
            dot.style.transform = 'translateX(16px)';
        }

        toggle.addEventListener('click', () => {
            document.body.classList.toggle('light');
            if (document.body.classList.contains('light')) {
                localStorage.setItem('theme', 'light');
                dot.style.transform = 'translateX(16px)';
            } else {
                localStorage.setItem('theme', 'dark');
                dot.style.transform = 'translateX(0)';
            }
        });

        // ===== DATA (ثابت - از فایل CSV) =====
        let users = [
            { name: "امیرحسین رجبی", father: "محمد رضا", birth: "۹/۷/۱۳۸۵", phone: "۰۹۹۳۴۶۳۳۵۱۵", email: "", field: "کامپیوتر نرم افزار", degree: "دیپلم کامپيوتر", cooperation: "حضوری", skills: "exel;word;coding;power point;It /هوشمصنوعی/کارای گرافیکی" },
            { name: "رضا رجبی", father: "علی", birth: "1388/10/7", phone: "+98 919 197 7969", email: "ragabireza88@gmail.com", field: "ریاضی", degree: "سیکل", cooperation: "حضوری", skills: "exel;word;coding;power point;IT / AI / نرم افزار / pthon / HTML / java script / SQL / godot engine" },
            { name: "محدثه کیانفر", father: "حسین", birth: "1381/8/11", phone: "09022621381", email: "", field: "حسابداری", degree: "کارشناسی", cooperation: "حضوری", skills: "exel;word;power point" },
            { name: "یلدا صفاری", father: "ابراهیم", birth: "۱۷/۱/۱۳۸۲", phone: "09914119075", email: "", field: "آمار", degree: "کارشناسی", cooperation: "حضوری", skills: "exel;word;power point" },
            { name: "فاطمه صادقپور", father: "مجید", birth: "1386/05/14", phone: "09139614512", email: "f1494583@gmail.com", field: "نرم افزار", degree: "ترم 2 کاردانی", cooperation: "حضوری", skills: "exel;word;power point;C#. Java." },
            { name: "نرگس عباسیان", father: "علی", birth: "۱۶/۱۲/۱۳۸۲", phone: "۰۹۱۹۹۰۲۶۴۸۰", email: "", field: "حسابداری", degree: "لیسانس", cooperation: "حضوری", skills: "exel;word;power point" },
            { name: "کوثر صادق پور بادی", father: "محمد", birth: "1381/07/12", phone: "09908727683", email: "", field: "علوم سیاسی", degree: "لیسانس علوم سیاسی و دانشجوی ارشد علوم سیاسی", cooperation: "حضوری", skills: "exel;word;power point" },
            { name: "زینب حیدری", father: "محمد", birth: "۱۳۸۶/۴/۱۹", phone: "۰۹۹۳۳۶۱۱۰۷۱", email: "heydariz632@gmail.com", field: "کامپیوتر (شبکه های کامپیوتری)", degree: "دیپلم (دانشجو)", cooperation: "حضوری", skills: "exel;word;power point" },
            { name: "سارا دشتی موخر", father: "مجتبی", birth: "۱۳۸۲/۱۰/۱۴", phone: "۰۹۹۰۷۷۱۶۰۲۴", email: "", field: "علوم تربیتی", degree: "کاردانی", cooperation: "حضوری", skills: "exel;word;power point" },
            { name: "نرگس حفاری", father: "محمدرضا", birth: "۳شهریور۸۴", phone: "۰۹۰۱۴۰۲۹۱۱۵", email: "", field: "دبیری دانشگاه فرهنگیان", degree: "لیسانس", cooperation: "حضوری", skills: "exel;word;coding;power point;اینفوگرافیک ..هوش مصنوعی‌...طراحی لوگو" },
            { name: "یونس رجبی", father: "محسن", birth: "1386.06.17", phone: "09022783552", email: "unes86r@gmail.com", field: "مهندسی کامپیوتر", degree: "کارشناسی پیوسته", cooperation: "حضوری", skills: "word;coding;power point;python /java / c++/networking/ windows/ IT/ AI engineer" },
            { name: "مهدی محمدیانی", father: "علی", birth: "۱۴۰۵/۰۵/۱۰", phone: "۰۹۹۰۸۴۱۱۶۶۳", email: "mhdgmlzgml@gmail.com", field: "شبکه کامپیوتر", degree: "دیپلم", cooperation: "حضوری", skills: "exel;word;coding;power point" },
            { name: "فائزه مشربی", father: "حسن", birth: "1381/08/17", phone: "۰۹۱۳۴۱۹۵۲۶۷", email: "mashrebifaeze@gmail.com", field: "مهندسی نرم افزار کامپیوتر", degree: "لیسانس کامپیوتر", cooperation: "حضوری", skills: "exel;word;power point" }
        ];

        // ===== DOM REFS =====
        const tableBody = document.getElementById('tableBody');
        const userCount = document.getElementById('userCount');

        // ===== RENDER TABLE =====
        function renderTable() {
            userCount.textContent = users.length;

            tableBody.innerHTML = '';
            users.forEach((user, index) => {
                const tr = document.createElement('tr');

                const skillsArray = user.skills.split(';').filter(s => s.trim() !== '');
                const skillsHtml = skillsArray.map(s =>
                    `<span class="badge-skill">${s.trim()}</span>`
                ).join(' ');

                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong style="color:#f5b06b;">${user.name}</strong></td>
                    <td>${user.father}</td>
                    <td>${user.birth}</td>
                    <td>${user.phone}</td>
                    <td style="direction:ltr;font-size:0.8rem;">${user.email || '—'}</td>
                    <td>${user.field}</td>
                    <td>${user.degree}</td>
                    <td><span class="badge-skill">${user.cooperation}</span></td>
                    <td style="max-width:200px;">${skillsHtml}</td>
                    <td>
                        <button class="btn-delete" data-index="${index}">
                            <i class="fas fa-trash-alt"></i> حذف
                        </button>
                    </td>
                `;

                tableBody.appendChild(tr);
            });

            // رویداد حذف
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', function() {
                    const index = parseInt(this.dataset.index);
                    if (confirm(`آیا از حذف "${users[index].name}" مطمئن هستید؟`)) {
                        users.splice(index, 1);
                        renderTable();
                    }
                });
            });
        }

        // ===== START =====
        renderTable();
    </script>

</body>
</html>
